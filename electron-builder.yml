appId: dev.rbxagents.desktop
productName: RBX Agents
copyright: Copyright © 2026 MrHB102
directories:
  output: release
files:
  - out/**
  - package.json
  - LICENSE
  - THIRD_PARTY_NOTICES.md
asarUnpack:
  - node_modules/**
extraResources:
  - from: resources
    to: resources
artifactName: RBX-Agents-${version}-${os}-${arch}.${ext}
win:
  icon: resources/icon.ico
  target:
    - nsis
  executableName: rbx-agents
nsis:
  oneClick: false
  perMachine: false
  allowToChangeInstallationDirectory: true
  createDesktopShortcut: true
linux:
  icon: resources/icon.png
  target:
    - AppImage
    - deb
  category: Development
  maintainer: MrHB102
  executableName: rbx-agents
