name: Build desktop packages
on:
  workflow_dispatch:
    inputs:
      include_legacy:
        description: Build legacy 32-bit packages (Electron 43; support ends January 2027)
        type: boolean
        default: false
permissions:
  contents: read
jobs:
  package:
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: windows-latest
            target: win
            arch: x64
          - os: windows-latest
            target: win
            arch: arm64
          - os: ubuntu-24.04
            target: linux
            arch: x64
          - os: ubuntu-24.04-arm
            target: linux
            arch: arm64
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
          cache: npm
      - run: npm ci
      - run: npm run verify:skills
      - run: npm test
      - run: npm run build
      - run: npx electron-builder --${{ matrix.target }} --${{ matrix.arch }} --publish never
        env:
          CSC_IDENTITY_AUTO_DISCOVERY: 'false'
      - uses: actions/upload-artifact@v4
        with:
          name: RBX-Agents-${{ matrix.target }}-${{ matrix.arch }}
          path: |
            release/*.exe
            release/*.AppImage
            release/*.deb
  legacy:
    if: inputs.include_legacy
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: windows-latest
            command: npm run dist:legacy:win
            arch: win-ia32
          - os: ubuntu-24.04
            command: npm run dist:legacy:linux
            arch: linux-armv7l
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
          cache: npm
      - run: npm ci
      - run: ${{ matrix.command }}
        env:
          CSC_IDENTITY_AUTO_DISCOVERY: 'false'
      - uses: actions/upload-artifact@v4
        with:
          name: RBX-Agents-legacy-${{ matrix.arch }}
          path: |
            release/*.exe
            release/*.tar.gz
